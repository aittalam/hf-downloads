<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HF Download History</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Reenie+Beanie&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            background: #fff;
        }
        h1 {
            font-family: 'Reenie Beanie', cursive;
            font-size: 2.5rem;
            text-align: center;
            margin: 10px 0 20px;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 12px;
            align-items: center;
        }
        .file-input {
            flex: 1;
            min-width: 200px;
        }
        .file-input input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .options {
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }
        .options label {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }
        .metric-select {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        /* time range bar */
        .range-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 18px;
            align-items: center;
            padding: 10px 12px;
            margin-bottom: 6px;
            border: 1px solid #eee;
            border-radius: 6px;
            background: #fafbfc;
            font-size: 13px;
        }
        .range-bar .label {
            color: #666;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .presets {
            display: flex;
            gap: 6px;
        }
        .preset {
            font: inherit;
            padding: 4px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #fff;
            color: #2c3e50;
            cursor: pointer;
        }
        .preset:hover {
            border-color: #2980b9;
        }
        .preset.active {
            border-color: #2980b9;
            background: #eaf3fb;
            font-weight: 600;
        }
        .range-inputs {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .range-inputs label {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #666;
        }
        .range-inputs input {
            font: inherit;
            padding: 4px 6px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #fff;
        }
        .range-inputs input[type=number] {
            width: 72px;
        }
        .range-info {
            color: #888;
            font-size: 12px;
            margin-left: auto;
            white-space: nowrap;
        }
        .range-hint {
            color: #999;
            font-size: 12px;
            text-align: center;
            margin: 0 0 10px;
            display: none;
        }

        .selected-repos {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
            min-height: 36px;
        }
        .repo-tag {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 10px;
            border: 1px solid #333;
            border-radius: 4px;
            background: #fff;
            font-size: 14px;
        }
        .repo-tag .color-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        .repo-tag button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            padding: 0;
            margin-left: 5px;
        }
        .clear-all {
            color: #666;
            cursor: pointer;
            font-size: 14px;
            align-self: center;
        }
        .clear-all:hover {
            color: #000;
        }
        .repo-selector {
            margin-bottom: 20px;
            position: relative;
        }
        .repo-selector input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        .repo-selector input:focus {
            border-radius: 4px 4px 0 0;
        }
        .repo-selector select {
            display: none;
            width: 100%;
            padding: 0;
            border: 1px solid #ddd;
            border-top: none;
            border-radius: 0 0 4px 4px;
            font-size: 14px;
            position: absolute;
            top: 100%;
            left: 0;
            background: #fff;
            z-index: 100;
            max-height: 250px;
            overflow-y: auto;
        }
        .repo-selector select.open {
            display: block;
        }
        .repo-selector select option {
            padding: 8px 10px;
            cursor: pointer;
        }
        .repo-selector select option:hover {
            background: #f0f0f0;
        }
        .chart-container {
            position: relative;
            height: 640px;
            margin-top: 20px;
        }
        #chart {
            width: 100%;
            height: 100%;
        }
        .instructions {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #888;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <h1>HF Download History</h1>

    <div class="controls">
        <div class="file-input">
            <input type="file" id="fileInput" accept=".jsonl,.json">
        </div>
        <div class="options">
            <select id="metricSelect" class="metric-select">
                <option value="downloads_30d">Downloads (30d)</option>
                <option value="downloads_all_time">Downloads (all time, cumulative)</option>
                <option value="downloads_daily">Downloads (daily, from all-time diffs)</option>
                <option value="likes">Likes</option>
            </select>
            <label>
                <input type="checkbox" id="logScale"> Log scale
            </label>
            <label>
                <input type="checkbox" id="alignTimeline"> Align timeline
            </label>
        </div>
    </div>

    <div class="range-bar">
        <span class="label">Range</span>
        <div class="presets" id="presets">
            <button class="preset" data-days="30" title="last 30 days">30d</button>
            <button class="preset" data-days="90" title="last 90 days">90d</button>
            <button class="preset" data-days="180" title="last 180 days">180d</button>
            <button class="preset" data-days="365" title="last year">1y</button>
            <button class="preset" data-days="" title="whole timeline">All</button>
        </div>
        <div class="range-inputs" id="rangeTime">
            <label>from <input type="date" id="fromDate"></label>
            <label>to <input type="date" id="toDate"></label>
        </div>
        <div class="range-inputs" id="rangeIndex">
            <label>from day <input type="number" id="fromDay"></label>
            <label>to day <input type="number" id="toDay"></label>
        </div>
        <div class="range-info" id="rangeInfo"></div>
    </div>

    <div class="range-hint" id="rangeHint"
         data-text="wheel = zoom · shift+drag = pan · drag the strip handles = range.">
        hint · wheel = zoom · shift+drag = pan · drag the strip handles = range.
    </div>

    <div class="selected-repos" id="selectedRepos"></div>

    <div class="repo-selector">
        <input type="text" id="repoSearch" placeholder="Type to filter repos..." disabled>
        <select id="repoSelect" size="10" disabled></select>
    </div>

    <div class="chart-container">
        <div id="chart"></div>
        <div class="instructions" id="instructions">
            Load a JSONL file to view download history
        </div>
    </div>

    <script src="viewer.js"></script>
</body>
</html>
